# Servidor de los archivos estáticos del frontend.
# Solo es alcanzable desde el gateway, que agrega HTTPS y las cabeceras de seguridad.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Los archivos compilados llevan un hash en el nombre: se pueden guardar para siempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Cualquier otra ruta la resuelve la aplicación (Vue Router).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
